# Store-wide declarations shared by every brand pack.
# This file is DATA (SRS D-6). Code reads it; code never restates it.

store:
  name: Castletronics
  currency: USD

# ---------------------------------------------------------------------------
# SKU grammar — operator ruling D-8, 2026-10-18 (CT-PIM-SRS-001-A1 FR-150)
#
#   {brand}.{mpn}[-{cond}][.{ending}]
#
#   "brand.mpn is the base, and an optional ending .x can follow, where x is one of:
#      M — a master listing, e.g. 2.53131A.M
#      a number — one serialized unit, e.g. 2.53131A.1
#      P and a quantity — a pack, e.g. 2.53131A.P3
#    A condition goes on the part number with a dash, before any dot ending.
#    A used serialized unit would be 2.53131A-U.1.
#    All dots between the parts, never a dash after the brand number."
# ---------------------------------------------------------------------------
sku_grammar:
  part_separator: "."          # between brand, mpn and ending
  condition_separator: "-"     # between mpn and condition code, before any ending
  brand_pattern: "[0-9]+"      # the BigCommerce brand id
  # Normalised MPN: upper-case, no whitespace, no dots (dots are part separators),
  # permitted characters only. Normalisation itself is declared per brand pack
  # (brand.yaml: mpn_normalisation); this is the shape the result must have.
  mpn_pattern: "[A-Z0-9][A-Z0-9_-]*"
  condition_codes: ["U", "OB", "R"]   # -U used · -OB open box · -R refurbished
  endings:
    master: "M"                # 2.53131A.M
    unit: "[1-9][0-9]*"        # 2.53131A.1  (serialized physical unit)
    pack: "P[1-9][0-9]*"       # 2.53131A.P3 (derivative pack of qty)

# Brands known to the store. The id is BigCommerce's brand_id and the SKU prefix.
# A brand without an id cannot have catalog SKUs built (PIM-Pipeline SKU_Strategy §1).
brands:
  - { name: "Lindström",       id: 59, aliases: ["Lindstrom"] }
  - { name: "Chip Quik",       id: 55 }
  - { name: "Techspray",       id: 54 }
  - { name: "Chemtronics",     id: 56 }
  - { name: "CAIG",            id: 57 }
  - { name: "MG Chemicals",    id: null }   # create in BC, then fill in
  - { name: "Pace Worldwide",  id: null }   # brand #2 (operator 2026-10-18) — create in BC, then fill in
