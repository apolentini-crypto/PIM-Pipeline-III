[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pim"
version = "0.0.1"
description = "Castletronics PIM Pipeline III — brand product data: assemble, decide, derive, publish (CT-PIM-SRS-001 + A1)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
publish = ["httpx>=0.27"]

[project.scripts]
pim = "pim.cli.main:main"

[tool.setuptools.packages.find]
include = ["pim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
