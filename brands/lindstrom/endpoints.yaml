endpoints:
  bc:
    adapter: bigcommerce
    environments: [sandbox, live]
    # canonical -> BC v3 field (FR-104); confirmed per field in fields.yaml (FR-105)
    field_map:
      name: name
      mpn: mpn
      ean: gtin
      description_html: description
      meta_description: meta_description
      book_list_price: price          # list IS the MSRP: price = retail_price = book list (ruling 2026-08-17)
      book_net_price: cost_price
      unit_weight_kg: weight
    custom_fields: []                  # filter_metadata, spec_display, esd_safe, ct_page_type, spec_docs arrive with derive (M2)
    sentinel_empty_fields: [related_products]
